services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-commandsphere}
      MYSQL_USER: ${DB_USERNAME:-commandsphere}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-prod-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
    volumes:
      - meili-prod-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.prod.Dockerfile
    environment: &backend-env
      APP_NAME: CommandSphere
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_TIMEZONE: America/Sao_Paulo
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: en
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-commandsphere}
      DB_USERNAME: ${DB_USERNAME:-commandsphere}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
      SCOUT_DRIVER: meilisearch
      SCOUT_QUEUE: "true"
      SCOUT_AFTER_COMMIT: "true"
      SCOUT_PREFIX: commandsphere_
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILISEARCH_MASTER_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  backend-web:
    image: nginx:1.27-alpine
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - backend

  horizon:
    build:
      context: .
      dockerfile: docker/backend.prod.Dockerfile
    command: ["php", "artisan", "horizon"]
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  reverb:
    build:
      context: .
      dockerfile: docker/backend.prod.Dockerfile
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      <<: *backend-env
      REVERB_HOST: localhost
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.prod.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      COMMANDSPHERE_API_INTERNAL_URL: http://backend-web/api/v1
      COMMANDSPHERE_REVERB_APP_KEY: ${REVERB_APP_KEY}
      COMMANDSPHERE_REVERB_HOST: localhost
      COMMANDSPHERE_REVERB_PORT: 8080
      COMMANDSPHERE_REVERB_SCHEME: http
    ports:
      - "4200:4000"
    depends_on:
      - backend-web

volumes:
  mysql-prod-data:
  redis-prod-data:
  meili-prod-data:
