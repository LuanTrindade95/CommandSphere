<main class="min-h-screen bg-deep-space text-slate-100">
  <section class="mx-auto flex min-h-screen w-full max-w-6xl flex-col px-6 py-8">
    <header class="flex items-center justify-between border-b border-white/10 pb-6">
      <a class="font-display text-xl font-semibold tracking-normal text-white" href="/">
        {{ 'app.name' | transloco }}
      </a>
      <span class="rounded-full border border-neon-cyan/30 px-3 py-1 text-xs font-medium text-neon-cyan">
        {{ 'shell.foundation' | transloco }}
      </span>
    </header>

    <section class="grid flex-1 place-items-center py-16">
      <div class="max-w-3xl">
        <p class="mb-4 text-sm font-semibold uppercase tracking-normal text-soft-purple">
          {{ 'shell.kicker' | transloco }}
        </p>
        <h1 class="font-display text-4xl font-semibold tracking-normal text-white md:text-6xl">
          {{ 'shell.headline' | transloco }}
        </h1>
        <p class="mt-6 max-w-2xl text-lg leading-8 text-neutral-gray">
          {{ 'shell.summary' | transloco }}
        </p>
      </div>
    </section>

    <router-outlet />
  </section>
</main>
